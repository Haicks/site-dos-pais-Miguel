<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia dos Pais!</title>
    <style>
        /* Estilos Gerais (Cores do Flamengo: Vermelho, Preto e Branco) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d0d; /* Fundo preto suave */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Cartão Principal */
        .card {
            background: linear-gradient(145deg, #1a1a1a, #111111);
            border: 3px solid #c8102e; /* Vermelho Mengão */
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(200, 16, 46, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Detalhe Decorativo de Faixas (Inspiração Rubro-Negra) */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #c8102e 50%, #000000 50%);
        }

        /* Título */
        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .badge {
            display: inline-block;
            background-color: #c8102e;
            color: #ffffff;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Seção da Carta */
        .carta-container {
            background-color: #222222;
            border-left: 4px solid #c8102e;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            text-align: left;
        }

        .carta-texto {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #f0f0f0;
            font-style: italic;
        }

        /* Ícone / Mensagem de Destaque */
        .hero-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        /* Rodapé */
        footer {
            margin-top: 20px;
            color: #888888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="hero-icon">🔴⚫</div>
        <h1>Feliz Dia dos Pais!</h1>
        <div class="badge">Meu Camisa 10</div>

        <section class="carta-container">
            <p class="carta-texto">
                Pai, obrigado por ser meu super-herói quando eu mais precisava.
            </p>
        </section>

        <footer>
            Com todo amor e carinho ❤️
        </footer>
    </main>

</body>
</html>
